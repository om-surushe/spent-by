name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload app files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".dockerignore,.env.example,.gitignore,Dockerfile,README.md,auth-config.js,data-format.md,docker-compose.yml,index.html,package.json,sample-data.json,scripts,server.js"
          target: "/home/ubuntu/finance-tracker"
          rm: false
          overwrite: true
          strip_components: 0

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_DIR=/home/ubuntu/finance-tracker bash /home/ubuntu/finance-tracker/scripts/deploy.sh
