name: Deploy Finance Vault Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to the Cloudflare preview environment
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: finance-vault-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    defaults:
      run:
        working-directory: next-app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate worker
        run: npm run worker:check

      - name: Build app
        run: npm run build

      - name: Deploy Cloudflare preview
        run: npm run worker:deploy:preview

      - name: Preview URL
        run: echo "https://finance-vault-worker-preview.omsurushe1907.workers.dev/?product=1"
