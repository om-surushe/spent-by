name: Deploy Spent by Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to production
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: finance-vault-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: next-app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run test
          npm run standards:check
          npm run check:responsive
          npm run worker:check

      - name: Build app
        run: npm run build

      - name: Apply production migrations
        run: npx wrangler d1 migrations apply finance-vault --remote --env production

      - name: Deploy Cloudflare production
        run: npm run worker:deploy:production

      - name: Production URL
        run: echo "https://spent-by.om-surushe.workers.dev/?product=1"
