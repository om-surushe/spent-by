name: Check Spent by

on:
  pull_request:
    paths:
      - next-app/**
      - .github/workflows/check.yml
  push:
    branches: [main]
    paths:
      - next-app/**
      - .github/workflows/check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run standards:check
      - run: npm run check:responsive
      - run: npm run worker:check
      - run: npm run build
