<svg xmlns="http://www.w3.org/2000/svg" width="1244" height="720" viewBox="0 0 1244 720" role="img" aria-label="worker sync boundary"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="32" y="63" fill="#1e293b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="32" dy="0">Spent by Om — Worker and D1 sync boundary</tspan></text><rect x="42" y="233" width="245" height="185" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="164.5" y="275" fill="#134e4a" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="164.5" dy="0">Browser client</tspan><tspan x="164.5" dy="20">recovery phrase derives</tspan><tspan x="164.5" dy="20">vault ID + auth token</tspan><tspan x="164.5" dy="20"></tspan><tspan x="164.5" dy="20">AES-GCM ciphertext</tspan><tspan x="164.5" dy="20">HMAC signed request</tspan><tspan x="164.5" dy="20">UUID + timestamp</tspan></text><rect x="432" y="158" width="335" height="350" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="599.5" y="199" fill="#7c2d12" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="599.5" dy="0">Cloudflare Worker</tspan><tspan x="599.5" dy="20"></tspan><tspan x="599.5" dy="20">1. Exact CORS origin</tspan><tspan x="599.5" dy="20">2. Request-size limit</tspan><tspan x="599.5" dy="20">3. IP rate limit</tspan><tspan x="599.5" dy="20">4. HMAC + token-hash check</tspan><tspan x="599.5" dy="20">5. ±5 min timestamp</tspan><tspan x="599.5" dy="20">6. Request-ID replay check</tspan><tspan x="599.5" dy="20">7. Per-vault rate limit</tspan><tspan x="599.5" dy="20">8. Validate ciphertext shape</tspan><tspan x="599.5" dy="20"></tspan><tspan x="599.5" dy="20">Routes</tspan><tspan x="599.5" dy="20">POST /v1/vaults</tspan><tspan x="599.5" dy="20">GET  /snapshot</tspan><tspan x="599.5" dy="20">POST /sync</tspan></text><rect x="912" y="173" width="300" height="320" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="1062" y="218" fill="#881337" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="1062" dy="0">D1</tspan><tspan x="1062" dy="20"></tspan><tspan x="1062" dy="20">vaults</tspan><tspan x="1062" dy="20">auth token hash</tspan><tspan x="1062" dy="20">quota and timestamps</tspan><tspan x="1062" dy="20"></tspan><tspan x="1062" dy="20">records</tspan><tspan x="1062" dy="20">IV + ciphertext only</tspan><tspan x="1062" dy="20">updatedAt / device ID</tspan><tspan x="1062" dy="20">tombstone status</tspan><tspan x="1062" dy="20"></tspan><tspan x="1062" dy="20">request_ids</tspan><tspan x="1062" dy="20">last 100 replay IDs</tspan><tspan x="1062" dy="20"></tspan><tspan x="1062" dy="20">Atomic batch</tspan><tspan x="1062" dy="20">merge + quota guard</tspan></text><rect x="497" y="593" width="650" height="95" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="822" y="625" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle"><tspan x="822" dy="0">Server-visible metadata: IDs, ciphertext size, timestamps.</tspan><tspan x="822" dy="18">IP/request frequency.</tspan><tspan x="822" dy="18">Never transaction plaintext or encryption key.</tspan></text><polyline points="287,326 432,326" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="767,326 912,326" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><image href="data:image/svg+xml;base64," x="1022" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1082" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1142" y="32" width="46" height="46"/></svg>