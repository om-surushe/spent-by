<svg xmlns="http://www.w3.org/2000/svg" width="1429" height="790" viewBox="0 0 1429 790" role="img" aria-label="vault lifecycle"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="47" y="63" fill="#1e293b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="47" dy="0">Spent by Om — recovery phrase to encrypted sync</tspan></text><text x="47" y="98" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="47" dy="0">Plaintext and keys stay in the browser. Cloudflare receives only signed ciphertext and its operational metadata.</tspan></text><rect x="32" y="138" width="690" height="620" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="57" y="172" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="57" dy="0">Your browser / device</tspan></text><rect x="67" y="228" width="170" height="105" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="151.5" y="264" fill="#134e4a" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="151.5" dy="0">24-word</tspan><tspan x="151.5" dy="20">recovery phrase</tspan><tspan x="151.5" dy="20">(root secret)</tspan></text><rect x="312" y="213" width="225" height="138" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="424" y="249" fill="#4c1d95" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="424" dy="0">Web Crypto</tspan><tspan x="424" dy="20">HKDF-SHA-256</tspan><tspan x="424" dy="20">→ vault ID</tspan><tspan x="424" dy="20">→ auth token</tspan><tspan x="424" dy="20">→ AES-256-GCM key</tspan></text><rect x="312" y="443" width="270" height="135" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="447" y="477" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="447" dy="0">IndexedDB (Dexie)</tspan><tspan x="447" dy="20">• vault metadata</tspan><tspan x="447" dy="20">• encrypted records</tspan><tspan x="447" dy="20">• 12-byte IV + ciphertext</tspan><tspan x="447" dy="20">• tombstones for deletes</tspan></text><rect x="67" y="468" width="170" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="152" y="503" fill="#78350f" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle"><tspan x="152" dy="0">sessionStorage</tspan><tspan x="152" dy="18.75">phrase while unlocked</tspan></text><rect x="772" y="138" width="625" height="620" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="797" y="172" fill="#c2410c" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="797" dy="0">Cloudflare (ciphertext only)</tspan></text><rect x="812" y="238" width="230" height="188" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="927" y="271" fill="#7c2d12" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle"><tspan x="927" dy="0">Worker API</tspan><tspan x="927" dy="18.75">• CORS + body limits</tspan><tspan x="927" dy="18.75">• HMAC authentication</tspan><tspan x="927" dy="18.75">• ±5 min timestamp</tspan><tspan x="927" dy="18.75">• replay-ID protection</tspan><tspan x="927" dy="18.75">• rate limits</tspan><tspan x="927" dy="18.75">• validates ciphertext</tspan></text><rect x="1107" y="238" width="230" height="188" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="1222" y="273" fill="#881337" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle"><tspan x="1222" dy="0">D1 database</tspan><tspan x="1222" dy="18.75">• vault auth hash</tspan><tspan x="1222" dy="18.75">• encrypted records</tspan><tspan x="1222" dy="18.75">• timestamps / device IDs</tspan><tspan x="1222" dy="18.75">• replay IDs</tspan><tspan x="1222" dy="18.75">• atomic quota check</tspan><tspan x="1222" dy="18.75">• deterministic merge</tspan></text><rect x="917" y="533" width="345" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="1089.5" y="566" fill="#334155" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="1089.5" dy="0">Cloudflare can observe</tspan><tspan x="1089.5" dy="20">vault/device IDs, ciphertext size,</tspan><tspan x="1089.5" dy="20">timestamps, IP/request frequency</tspan><tspan x="1089.5" dy="20">—not amounts, merchants, or notes</tspan></text><polyline points="237,280 312,280" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="245" y="267" fill="#0f766e" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start"><tspan x="245" dy="0">derive</tspan></text><polyline points="425,351 425,443" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="439" y="399" fill="#0369a1" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start"><tspan x="439" dy="0">encrypt / decrypt</tspan></text><polyline points="582,498 697,498 812,350" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="697" y="442" fill="#c2410c" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle"><tspan x="697" dy="0">signed ciphertext</tspan><tspan x="697" dy="17.5">push / pull snapshot</tspan></text><polyline points="1042,332 1107,332" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><image href="data:image/svg+xml;base64," x="1207" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1267" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1327" y="32" width="46" height="46"/></svg>