<svg xmlns="http://www.w3.org/2000/svg" width="1359" height="700" viewBox="0 0 1359 700" role="img" aria-label="dashboard preferences"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="37" y="68" fill="#1e293b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="37" dy="0">Spent by Om — dashboard and preference boundaries</tspan></text><rect x="32" y="153" width="690" height="515" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="55" y="186" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="55" dy="0">Unlocked vault dashboard</tspan></text><rect x="72" y="248" width="220" height="135" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="182" y="289" fill="#4c1d95" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="182" dy="0">Encrypted records</tspan><tspan x="182" dy="20">from IndexedDB</tspan><tspan x="182" dy="20">(decrypted in memory)</tspan><tspan x="182" dy="20">transactions + settings</tspan></text><rect x="407" y="233" width="245" height="165" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="529.5" y="274" fill="#881337" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="529.5" dy="0">Derived UI state</tspan><tspan x="529.5" dy="20">month / search filters</tspan><tspan x="529.5" dy="20">category totals</tspan><tspan x="529.5" dy="20">monthly spend</tspan><tspan x="529.5" dy="20">review queue</tspan><tspan x="529.5" dy="20">budget progress</tspan></text><rect x="212" y="473" width="235" height="115" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="329.5" y="513" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="329.5" dy="0">Budget settings record</tspan><tspan x="329.5" dy="20">encrypted + synced</tspan><tspan x="329.5" dy="20">for four fixed categories</tspan></text><rect x="797" y="153" width="530" height="515" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="821" y="186" fill="#c2410c" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="821" dy="0">Device-only preferences</tspan></text><rect x="847" y="243" width="430" height="180" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="1062" y="284" fill="#78350f" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="1062" dy="0">localStorage</tspan><tspan x="1062" dy="20">• dashboard section order / hidden sections</tspan><tspan x="1062" dy="20">• payment sources and default source</tspan><tspan x="1062" dy="20">• categories and subcategories</tspan><tspan x="1062" dy="20">• labels / display language</tspan><tspan x="1062" dy="20"></tspan><tspan x="1062" dy="20">Not encrypted. Not synced to another device.</tspan></text><rect x="907" y="498" width="310" height="95" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="1062" y="536" fill="#134e4a" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="1062" dy="0">Service worker: network first</tspan><tspan x="1062" dy="20">cache successful GET responses</tspan></text><polyline points="292,315 407,315" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="529,398 369,473" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="652,313 847,313" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><image href="data:image/svg+xml;base64," x="1137" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1197" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1257" y="32" width="46" height="46"/></svg>