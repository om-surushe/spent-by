<svg xmlns="http://www.w3.org/2000/svg" width="1129" height="710" viewBox="0 0 1129 710" role="img" aria-label="pwa deployment flow"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="32" y="63" fill="#1e293b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="32" dy="0">Spent by Om — PWA, validation, and deployment</tspan></text><rect x="42" y="198" width="225" height="180" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="154.5" y="239" fill="#134e4a" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="154.5" dy="0">Developer</tspan><tspan x="154.5" dy="20"></tspan><tspan x="154.5" dy="20">npm run build</tspan><tspan x="154.5" dy="20">standards check</tspan><tspan x="154.5" dy="20">worker type-check</tspan><tspan x="154.5" dy="20">responsive check</tspan><tspan x="154.5" dy="20">manual preview deploy</tspan></text><rect x="402" y="163" width="280" height="250" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="542" y="204" fill="#4c1d95" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="542" dy="0">Quality checks</tspan><tspan x="542" dy="20">pull requests + main</tspan><tspan x="542" dy="20"></tspan><tspan x="542" dy="20">Preview deploy</tspan><tspan x="542" dy="20">manual, any ref</tspan><tspan x="542" dy="20"></tspan><tspan x="542" dy="20">Production deploy</tspan><tspan x="542" dy="20">manual, protected environment</tspan><tspan x="542" dy="20">Cloudflare token secret</tspan></text><rect x="822" y="163" width="275" height="250" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="959.5" y="204" fill="#7c2d12" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="959.5" dy="0">Cloudflare Worker</tspan><tspan x="959.5" dy="20"></tspan><tspan x="959.5" dy="20">Vite assets</tspan><tspan x="959.5" dy="20">SPA fallback</tspan><tspan x="959.5" dy="20">/v1 Worker routes</tspan><tspan x="959.5" dy="20">D1 bindings</tspan><tspan x="959.5" dy="20">rate limit bindings</tspan><tspan x="959.5" dy="20">spent-by-preview and spent-by</tspan><tspan x="959.5" dy="20">are separate Workers</tspan></text><rect x="322" y="558" width="360" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="502" y="600" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="502" dy="0">Installed PWA</tspan><tspan x="502" dy="20">manifest + service worker</tspan><tspan x="502" dy="20">network-first GET cache / offline fallback</tspan></text><polyline points="267,288 402,288" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="682,288 822,288" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="960,413 550,558" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><image href="data:image/svg+xml;base64," x="907" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="967" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1027" y="32" width="46" height="46"/></svg>