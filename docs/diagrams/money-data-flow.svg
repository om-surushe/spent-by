<svg xmlns="http://www.w3.org/2000/svg" width="1214" height="695" viewBox="0 0 1214 695" role="img" aria-label="money data flow"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="32" y="63" fill="#1e293b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="32" dy="0">Spent by Om — money data lifecycle</tspan></text><text x="32" y="99" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="32" dy="0">One expense is encrypted locally, shown in the ledger, optionally synced, and kept as a tombstone when deleted.</tspan></text><rect x="47" y="218" width="190" height="130" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="142" y="260" fill="#134e4a" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="142" dy="0">Quick Add / Edit</tspan><tspan x="142" dy="20">amount, reason, date</tspan><tspan x="142" dy="20">category, source</tspan><tspan x="142" dy="20">notes, review flag</tspan></text><rect x="322" y="203" width="220" height="160" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="432" y="244" fill="#4c1d95" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="432" dy="0">TransactionRecord</tspan><tspan x="432" dy="20">UUID + device ID</tspan><tspan x="432" dy="20">created/updated times</tspan><tspan x="432" dy="20">deletedAt tombstone</tspan><tspan x="432" dy="20">TransactionData payload</tspan></text><rect x="627" y="203" width="205" height="160" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="729.5" y="248" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="729.5" dy="0">Encrypt with AES-GCM</tspan><tspan x="729.5" dy="20">new IV per record</tspan><tspan x="729.5" dy="20">↓</tspan><tspan x="729.5" dy="20">IndexedDB</tspan><tspan x="729.5" dy="20">ciphertext only</tspan></text><rect x="917" y="178" width="265" height="210" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="1049.5" y="222" fill="#881337" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="1049.5" dy="0">Decrypt in memory</tspan><tspan x="1049.5" dy="20">↓</tspan><tspan x="1049.5" dy="20">Ledger + filters</tspan><tspan x="1049.5" dy="20">Review queue</tspan><tspan x="1049.5" dy="20">Budget calculations</tspan><tspan x="1049.5" dy="20">Dashboard totals</tspan><tspan x="1049.5" dy="20">Edit or delete</tspan></text><rect x="622" y="518" width="220" height="125" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="732" y="560" fill="#7c2d12" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="732" dy="0">Optional cloud sync</tspan><tspan x="732" dy="20">full encrypted snapshot</tspan><tspan x="732" dy="20">newest update wins</tspan></text><rect x="917" y="498" width="265" height="165" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="1049.5" y="540" fill="#78350f" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="1049.5" dy="0">Import JSON</tspan><tspan x="1049.5" dy="20">validate → encrypt → save</tspan><tspan x="1049.5" dy="20"></tspan><tspan x="1049.5" dy="20">Export transactions</tspan><tspan x="1049.5" dy="20">plaintext JSON</tspan><tspan x="1049.5" dy="20">Encrypted vault backup</tspan></text><polyline points="237,283 322,283" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="542,283 627,283" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="832,283 917,283" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="729,363 729,518" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1049,388 1049,498" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><image href="data:image/svg+xml;base64," x="992" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1052" y="32" width="46" height="46"/><image href="data:image/svg+xml;base64," x="1112" y="32" width="46" height="46"/></svg>